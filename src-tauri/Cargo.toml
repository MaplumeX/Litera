[package]
name = "litera"
version = "0.5.5"
description = "Agent-Enhanced EPUB Reader"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "litera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri requires each plugin's npm package and Rust crate to share a
# major/minor release, and the CLI refuses to build otherwise. Every dependency
# here that has an npm counterpart (`tauri` / `@tauri-apps/api`, and each
# `tauri-plugin-*` with a matching `@tauri-apps/plugin-*`) is therefore
# minor-locked with `~` on both sides, so neither side can drift to a new minor
# on its own. Run `node scripts/check-tauri-pairing.mjs` to verify; CI does.
tauri = { version = "~2.12.1", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-http = "~2.8.0"
tauri-plugin-opener = "~2.7.0"
chrono = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
getrandom = "0.3"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
object_store = { version = "0.14", features = ["aws"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
futures = "0.3"
md-5 = "0.11.0"
tauri-plugin-litera-platform = { path = "plugins/litera-platform" }
ttf-parser = "0.25"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# System font enumeration for the font picker; Android lists the CSS generics.
font-kit = "0.14"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"

[target.'cfg(target_os = "android")'.dependencies]
# object_store's default TLS verifier (rustls-platform-verifier) needs JNI
# initialization on Android; Sync uses these bundled roots there instead.
webpki-root-certs = "1"
